<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="abtBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="abtNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="abtFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="abtGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="abtGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#abtBg)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Academy Shield Base -->
  <g filter="url(#abtGlow)">
    <path d="M60 22 L86 34 C86 64 60 88 60 88 C60 88 34 64 34 34 Z" fill="url(#abtNavy)"/>
  </g>

  <!-- Torch Handle -->
  <path d="M56 60 L64 60 L62 82 L58 82 Z" fill="url(#abtGold)"/>
  <!-- Torch Bowl -->
  <path d="M52 52 L68 52 L65 60 L55 60 Z" fill="url(#abtGold)"/>

  <!-- Radiant Torch Flame of Knowledge -->
  <path d="M60 28 C64 36 72 40 70 48 C68 54 62 54 60 54 C58 54 52 54 50 48 C48 40 56 36 60 28 Z" fill="url(#abtFlame)"/>
  <path d="M60 36 C62 40 66 42 65 47 C64 50 61 50 60 50 C59 50 56 50 55 47 C54 42 58 40 60 36 Z" fill="#ffffff" fill-opacity="0.9"/>

  <!-- Academic Star Laurels -->
  <circle cx="44" cy="46" r="2.5" fill="url(#abtGold)"/>
  <circle cx="76" cy="46" r="2.5" fill="url(#abtGold)"/>
  <circle cx="42" cy="58" r="2" fill="url(#abtGold)"/>
  <circle cx="78" cy="58" r="2" fill="url(#abtGold)"/>
</svg>
