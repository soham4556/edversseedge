<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="andBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="andGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="50%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="andGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#16a34a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#andBg)" stroke="#bbf7d0" stroke-width="1.5"/>

  <!-- Android Robot Head with Antennae -->
  <g filter="url(#andGlow)">
    <!-- Antennae -->
    <line x1="44" y1="36" x2="36" y2="24" stroke="url(#andGreen)" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="76" y1="36" x2="84" y2="24" stroke="url(#andGreen)" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Dome Head -->
    <path d="M34 56 C34 41 46 36 60 36 C74 36 86 41 86 56 Z" fill="url(#andGreen)"/>

    <!-- Eyes -->
    <circle cx="48" cy="48" r="3.5" fill="#ffffff"/>
    <circle cx="72" cy="48" r="3.5" fill="#ffffff"/>

    <!-- Body -->
    <path d="M34 60 L86 60 L86 86 C86 91 82 95 77 95 L43 95 C38 95 34 91 34 86 Z" fill="url(#andGreen)"/>

    <!-- Left Arm -->
    <rect x="23" y="60" width="7" height="26" rx="3.5" fill="url(#andGreen)"/>
    <!-- Right Arm -->
    <rect x="90" y="60" width="7" height="26" rx="3.5" fill="url(#andGreen)"/>

    <!-- Left Leg -->
    <rect x="44" y="95" width="7" height="14" rx="3.5" fill="url(#andGreen)"/>
    <!-- Right Leg -->
    <rect x="69" y="95" width="7" height="14" rx="3.5" fill="url(#andGreen)"/>
  </g>
</svg>
