<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="tsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="tsScreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1f3a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="tsCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="tsGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="tsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#tsBg)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Computer Monitor Frame -->
  <g filter="url(#tsGlow)">
    <rect x="22" y="24" width="76" height="52" rx="10" fill="url(#tsScreen)" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Monitor Stand -->
  <rect x="54" y="76" width="12" height="12" fill="#1e3a8a"/>
  <rect x="42" y="88" width="36" height="6" rx="3" fill="#0b1f3a"/>

  <!-- Target Bullseye inside screen -->
  <circle cx="44" cy="50" r="14" stroke="url(#tsCyan)" stroke-width="2" stroke-dasharray="3 2" fill="none"/>
  <circle cx="44" cy="50" r="8" stroke="#38bdf8" stroke-width="1.5" fill="none"/>
  <circle cx="44" cy="50" r="3.5" fill="#f59e0b"/>

  <!-- Analytics Mini Bar Chart inside screen -->
  <rect x="66" y="54" width="5" height="12" rx="2" fill="url(#tsCyan)"/>
  <rect x="74" y="46" width="5" height="20" rx="2" fill="url(#tsCyan)"/>
  <rect x="82" y="38" width="5" height="28" rx="2" fill="url(#tsGreen)"/>

  <!-- Screen Top Bar / Window Buttons -->
  <circle cx="30" cy="32" r="2" fill="#ef4444"/>
  <circle cx="36" cy="32" r="2" fill="#f59e0b"/>
  <circle cx="42" cy="32" r="2" fill="#10b981"/>
</svg>
