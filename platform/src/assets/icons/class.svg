<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="classBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <linearGradient id="classShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#3b0764"/>
    </linearGradient>
    <linearGradient id="classGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="classGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#581c87" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#classBg)" stroke="#e9d5ff" stroke-width="1.5"/>

  <!-- Main Academic Crest Shield -->
  <g filter="url(#classGlow)">
    <path d="M60 20 L88 32 C88 64 60 88 60 88 C60 88 32 64 32 32 Z" fill="url(#classShield)"/>
  </g>

  <!-- Graduation Cap (Mortarboard) -->
  <polygon points="60,26 84,36 60,46 36,36" fill="url(#classGold)"/>
  <polygon points="46,42 46,52 60,58 74,52 74,42 60,48" fill="#ffffff" fill-opacity="0.9"/>
  <!-- Tassel -->
  <path d="M78 39 L78 52 C78 54 80 56 82 56" stroke="url(#classGold)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <circle cx="82" cy="56" r="2.5" fill="url(#classGold)"/>

  <!-- Open Book of Knowledge -->
  <path d="M60 62 C52 57 42 57 38 60 L38 78 C42 75 52 75 60 80 C68 75 78 75 82 78 L82 60 C78 57 68 57 60 62 Z" fill="#ffffff" fill-opacity="0.95"/>
  <line x1="60" y1="62" x2="60" y2="80" stroke="#7c3aed" stroke-width="2"/>

  <!-- Book Text Lines Representation -->
  <line x1="43" y1="66" x2="55" y2="66" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="43" y1="71" x2="53" y2="71" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="66" x2="77" y2="66" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="65" y1="71" x2="75" y2="71" stroke="#9333ea" stroke-width="1.5" stroke-linecap="round"/>
</svg>
