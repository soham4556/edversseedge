<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="iitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="iitShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0b1f3a"/>
    </linearGradient>
    <linearGradient id="iitGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="iitCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="iitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#iitBg)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Main Engineering Crest Shield -->
  <g filter="url(#iitGlow)">
    <path d="M60 20 L88 32 C88 64 60 88 60 88 C60 88 32 64 32 32 Z" fill="url(#iitShield)"/>
  </g>

  <!-- Orbital Rings (Physics / Atomic Engineering) -->
  <ellipse cx="60" cy="50" rx="22" ry="8" stroke="url(#iitCyan)" stroke-width="2" transform="rotate(-28 60 50)" stroke-dasharray="3 1.5"/>
  <ellipse cx="60" cy="50" rx="22" ry="8" stroke="url(#iitCyan)" stroke-width="2" transform="rotate(28 60 50)" stroke-dasharray="3 1.5"/>

  <!-- Orbital Nucleus & Electron Sparks -->
  <circle cx="60" cy="50" r="5" fill="url(#iitGold)"/>
  <circle cx="76" cy="41" r="2.5" fill="#38bdf8"/>
  <circle cx="44" cy="59" r="2.5" fill="#38bdf8"/>

  <!-- Advanced Delta Arrow / Apex of Ascent -->
  <path d="M60 32 L70 54 L60 50 L50 54 Z" fill="url(#iitGold)"/>

  <!-- Precision Caliper / Mathematics Compass Arc -->
  <path d="M46 68 Q60 62 74 68" stroke="url(#iitGold)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- IIT Badge Star -->
  <polygon points="60,66 62.5,73 70,73.5 64,78 66,85 60,81 54,85 56,78 50,73.5 57.5,73" fill="url(#iitGold)"/>
</svg>
