<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="cntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cntBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="cntPin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="cntGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#1d4ed8" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#cntBg)" stroke="#bfdbfe" stroke-width="1.5"/>

  <!-- Chat Bubble Base -->
  <g filter="url(#cntGlow)">
    <path d="M28 34 C28 26 34 22 42 22 L78 22 C86 22 92 26 92 34 L92 64 C92 72 86 76 78 76 L52 76 L36 88 L38 76 L42 76 C34 76 28 72 28 64 Z" fill="url(#cntBlue)"/>
  </g>

  <!-- Interactive Chat Lines -->
  <rect x="42" y="38" width="36" height="5" rx="2.5" fill="#ffffff" fill-opacity="0.95"/>
  <rect x="42" y="48" width="26" height="5" rx="2.5" fill="#93c5fd"/>

  <!-- Location Map Pin Overlay on Chat -->
  <g filter="url(#cntGlow)">
    <path d="M72 48 C66 48 62 52 62 58 C62 66 72 78 72 78 C72 78 82 66 82 58 C82 52 78 48 72 48 Z" fill="url(#cntPin)"/>
    <circle cx="72" cy="58" r="3.5" fill="#ffffff"/>
  </g>
</svg>
