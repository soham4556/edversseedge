<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="resBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="resGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="resBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="resGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#b45309" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#resBg)" stroke="#fde68a" stroke-width="1.5"/>

  <!-- Trophy Cup Body -->
  <g filter="url(#resGlow)">
    <path d="M42 26 L78 26 L74 54 C74 64 64 72 60 72 C56 72 46 64 46 54 Z" fill="url(#resGold)"/>
  </g>

  <!-- Trophy Handles -->
  <path d="M42 30 C30 30 30 48 44 48" stroke="url(#resGold)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M78 30 C90 30 90 48 76 48" stroke="url(#resGold)" stroke-width="4" stroke-linecap="round" fill="none"/>

  <!-- Trophy Stem and Foot -->
  <path d="M57 72 L63 72 L64 82 L56 82 Z" fill="url(#resGold)"/>
  <path d="M50 82 L70 82 L72 86 L48 86 Z" fill="url(#resGold)"/>

  <!-- Marble Pedestal Base -->
  <rect x="42" y="86" width="36" height="12" rx="3" fill="url(#resBase)"/>
  <rect x="48" y="90" width="24" height="4" rx="1.5" fill="url(#resGold)"/>

  <!-- Embossed Star in Center of Trophy -->
  <polygon points="60,36 62,42 68,42.5 63,46.5 65,52.5 60,49 55,52.5 57,46.5 52,42.5 58,42" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Victory Laurel Leaves -->
  <path d="M36 62 C34 56 36 50 40 46" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M84 62 C86 56 84 50 80 46" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
</svg>
