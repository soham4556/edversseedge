<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <linearGradient id="progBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="100%" stop-color="#ccfbf1"/>
    </linearGradient>
    <linearGradient id="progTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="progGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="progGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0f766e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#progBg)" stroke="#99f6e4" stroke-width="1.5"/>

  <!-- Stepped Academic Roadmap Pathway -->
  <g filter="url(#progGlow)">
    <!-- Ascending Pathway Bar 1 -->
    <rect x="28" y="68" width="16" height="26" rx="6" fill="#14b8a6"/>
    <!-- Ascending Pathway Bar 2 -->
    <rect x="52" y="50" width="16" height="44" rx="6" fill="#0d9488"/>
    <!-- Ascending Pathway Bar 3 -->
    <rect x="76" y="32" width="16" height="62" rx="6" fill="url(#progTeal)"/>
  </g>

  <!-- Connecting Growth Trajectory Vector Arrow -->
  <path d="M34 62 L58 44 L82 26" stroke="url(#progGold)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="88,22 84,30 76,28" fill="url(#progGold)"/>

  <!-- Milestone Checkmark Nodes -->
  <circle cx="36" cy="62" r="5" fill="#ffffff" stroke="url(#progGold)" stroke-width="2"/>
  <circle cx="60" cy="44" r="5" fill="#ffffff" stroke="url(#progGold)" stroke-width="2"/>
  <circle cx="84" cy="26" r="6" fill="url(#progGold)"/>

  <!-- Flag at the Peak -->
  <path d="M84 26 L84 14 L98 20 L84 26 Z" fill="url(#progGold)"/>
</svg>
